name: PurpleMixer
options:
  bundleIdPrefix: com.yourname.blank3
  deploymentTarget:
    macOS: "15.0"
settings:
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  SWIFT_VERSION: "6.0"
  DEVELOPMENT_TEAM: ""  # впишите свой Team ID из Xcode -> Signing & Capabilities
targets:
  PurpleMixer:
    type: application
    platform: macOS
    sources:
      - path: Sources/PurpleMixer
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true          # приложение без иконки в Dock — только в menu bar
        CFBundleDisplayName: "BLANK3.0"
        CFBundleName: "BLANK3.0"
        NSAudioCaptureUsageDescription: "BLANK3.0 нужен доступ к системному аудио, чтобы показывать и регулировать громкость каждого приложения по отдельности."
        CFBundleShortVersionString: "3.0"
        CFBundleVersion: "3"
    entitlements:
      path: Resources/PurpleMixer.entitlements
      properties:
        com.apple.security.app-sandbox: false   # без sandbox — процесс-tap проще получает разрешение
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: "BLANK3.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.blank3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad-hoc, но СТАБИЛЬНАЯ подпись (см. build.sh) — важно для того, чтобы
        # разрешение на запись системного звука спрашивалось только один раз.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: true
schemes:
  PurpleMixer:
    build:
      targets:
        PurpleMixer: all
    run:
      config: Debug
